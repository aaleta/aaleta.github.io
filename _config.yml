# ── Site ───────────────────────────────────────────────────────────────────
title: Alberto Aleta
first_name: Alberto
last_name: Aleta
email: aaleta@unizar.es
description: >-
  Alberto Aleta — data and network scientist, Ramón y Cajal fellow at BIFI
  (University of Zaragoza). Networks, epidemics, and collective behaviour.
url: https://aaleta.github.io
baseurl: ""
lang: en
timezone: Europe/Madrid

# Affiliation strings reused in templates
affiliation_short: BIFI, University of Zaragoza
institute_name: Institute for Biocomputation and Physics of Complex Systems
institute_url: https://bifi.es/

# ── Build ──────────────────────────────────────────────────────────────────
permalink: pretty
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

include:
  - _pages

exclude:
  - README.md
  - CLAUDE.md
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache

sass:
  style: compressed
  sass_dir: _sass
  quiet_deps: true
  silence_deprecations:
    - import

# ── Collections ────────────────────────────────────────────────────────────
collections:
  projects:
    output: false   # data-only: rendered as cards on /projects/, no per-project pages

# ── Plugins ────────────────────────────────────────────────────────────────
plugins:
  - jekyll/scholar
  - jekyll-sitemap

# ── jekyll-scholar ─────────────────────────────────────────────────────────
scholar:
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_reports: reports.bib   # custom var, referenced as site.scholar.bibliography_reports
  bibliography_template: bib          # → _layouts/bib.liquid
  bibtex_filters:
    - latex
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending
